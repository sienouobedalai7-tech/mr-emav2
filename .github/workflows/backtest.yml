name: MR EMA v2 - Backtest (manuel)

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le backtest
        run: python backtest.py

      - name: Publier le rapport comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: rapport-backtest
          path: data/rapport_backtest.txt
          retention-days: 30
